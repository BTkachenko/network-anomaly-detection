name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check python tests tools
      - run: python -m ruff format --check --quiet python tests tools
      - run: python -m compileall -q python tests tools
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_results.py
